<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report an Item – FindIt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap">
  <div class="page-head">
    <h1>Report an item</h1>
    <p>Tell us what was lost or found. The more details you add, the easier it is for the owner to recognise it.</p>
  </div>

  <form class="form-card" id="report-form" novalidate>
    <fieldset class="field">
      <legend>What happened?</legend>
      <div class="toggle">
        <input type="radio" name="type" id="t-lost" value="Lost" checked>
        <label for="t-lost">I lost an item</label>
        <input type="radio" name="type" id="t-found" value="Found">
        <label for="t-found">I found an item</label>
      </div>
    </fieldset>

    <div class="field" id="g-title">
      <label for="title">Item name</label>
      <input type="text" id="title" maxlength="60" placeholder="Black leather wallet">
      <span class="msg" data-for="title"></span>
    </div>

    <div class="two">
      <div class="field" id="g-category">
        <label for="category">Category</label>
        <select id="category"></select>
      </div>
      <div class="field" id="g-date">
        <label for="date">Date</label>
        <input type="date" id="date">
        <span class="msg" data-for="date"></span>
      </div>
    </div>

    <div class="field" id="g-location">
      <label for="location">Place</label>
      <input type="text" id="location" maxlength="80" placeholder="Bus stand, Thodupuzha">
      <span class="msg" data-for="location"></span>
    </div>

    <div class="field">
      <label for="desc">Details</label>
      <textarea id="desc" rows="3" maxlength="200" placeholder="Colour, brand, marks or anything that helps identify it"></textarea>
      <small>Do not write ID numbers or card numbers here.</small>
    </div>

    <div class="field" id="g-contact">
      <label for="contact">Your phone number or email</label>
      <input type="text" id="contact" maxlength="60" placeholder="name@example.com or 9XXXXXXXXX">
      <span class="msg" data-for="contact"></span>
    </div>

    <div class="field" id="g-image">
      <label for="image">Photo (optional)</label>
      <div class="upload">
        <input type="file" id="image" accept="image/*">
        <img id="preview" class="preview" alt="Preview of the selected photo">
      </div>
      <span class="msg" data-for="image"></span>
    </div>

    <button type="submit" class="btn pink" id="submit">Post report</button>
  </form>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const form = $("report-form");
  let imageData = "";   // the resized photo, saved as text

  /* Fill the category list and today's date */
  Object.keys(CATEGORY_ICONS).forEach(c => $("category").add(new Option(c, c)));
  $("date").value = daysAgo(0);
  $("date").max = daysAgo(0);

  /* Home page buttons send ?type=Lost or ?type=Found */
  const wanted = new URLSearchParams(location.search).get("type");
  if (wanted === "Found") $("t-found").checked = true;

  /* ---------- Photo preview (resized so it fits in browser storage) ---------- */
  $("image").addEventListener("change", e => {
    const file = e.target.files[0];
    setError("image", "");
    imageData = "";
    $("preview").classList.remove("show");
    if (!file) return;
    if (!file.type.startsWith("image/")) { setError("image", "Please choose an image file."); return; }
    if (file.size > 8 * 1024 * 1024) { setError("image", "Image is too large. Choose one under 8 MB."); return; }

    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 480;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        imageData = canvas.toDataURL("image/jpeg", 0.7);
        $("preview").src = imageData;
        $("preview").classList.add("show");
      };
      img.onerror = () => setError("image", "This image could not be read. Try another one.");
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  /* ---------- Validation ---------- */
  function setError(id, text) {
    const box = document.querySelector('.msg[data-for="' + id + '"]');
    if (box) box.textContent = text;
    const group = $("g-" + id);
    if (group) group.classList.toggle("invalid", Boolean(text));
  }

  function validate() {
    let ok = true;
    const title = $("title").value.trim();
    const place = $("location").value.trim();
    const contact = $("contact").value.trim();
    const date = $("date").value;

    const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact);
    const isPhone = /^\+?[0-9 ()-]{10,15}$/.test(contact);

    if (title.length < 3) { setError("title", "Enter the item name (at least 3 letters)."); ok = false; } else setError("title", "");
    if (!date) { setError("date", "Choose a date."); ok = false; } else if (date > daysAgo(0)) { setError("date", "The date cannot be in the future."); ok = false; } else setError("date", "");
    if (place.length < 3) { setError("location", "Enter the place."); ok = false; } else setError("location", "");
    if (!isEmail && !isPhone) { setError("contact", "Enter a valid email or a 10-digit phone number."); ok = false; } else setError("contact", "");
    return ok;
  }

  /* ---------- Toast message ---------- */
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  /* ---------- Save the report ---------- */
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (!validate()) {
      const firstBad = form.querySelector(".invalid input, .invalid select");
      if (firstBad) firstBad.focus();
      return;
    }
    const type = form.querySelector('input[name="type"]:checked').value;
    const items = getItems();
    items.push({
      id: Date.now(),
      type: type,
      title: $("title").value.trim(),
      category: $("category").value,
      location: $("location").value.trim(),
      date: $("date").value,
      desc: $("desc").value.trim(),
      contact: $("contact").value.trim(),
      image: imageData,
      returned: false
    });
    saveItems(items);
    $("submit").disabled = true;
    toast(type + " report posted. Taking you to the home page…");
    setTimeout(() => { location.href = "index.html"; }, 1800);
  });
</script>
</body>
</html>
