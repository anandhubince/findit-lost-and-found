<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost Items – FindIt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-type="Lost">

<main class="wrap">
  <div class="page-head">
    <h1>Lost items</h1>
    <p>Items people have lost. If you have seen one, open it and contact the owner.</p>
  </div>

  <div class="toolbar">
    <input id="list-search" type="search" placeholder="Search by item, place or details…" aria-label="Search lost items">
    <select id="list-category" aria-label="Filter by category">
      <option value="all">All categories</option>
    </select>
  </div>
  <p class="list-count" id="list-count" aria-live="polite"></p>
  <ul class="grid" id="list"></ul>
  <p><a class="btn pink" href="report.html?type=Lost">Report a lost item</a></p>
</main>

<script src="script.js"></script>
</body>
</html>
