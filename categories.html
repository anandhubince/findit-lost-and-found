<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories – FindIt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap">
  <div class="page-head">
    <h1>Browse by category</h1>
    <p>Pick a category to see every lost and found item in it.</p>
  </div>

  <div class="cat-grid" id="cat-tiles"></div>

  <h2 class="cat-heading" id="cat-heading" aria-live="polite"></h2>
  <ul class="grid" id="cat-results"></ul>
</main>

<script src="script.js"></script>
</body>
</html>
